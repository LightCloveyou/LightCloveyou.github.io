<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="./v4.css?v=ascii-final-1">

  <main class="app" id="app">
    <canvas id="screen" aria-label="随音乐演化的计算机、字符雕塑与几何动画" role="img"></canvas>
    <header class="head">
      <div class="identity"><span class="status-dot"></span><strong>world.execute(me);</strong><span class="edition">V4 / CONTINUOUS MATTER</span></div>
      <div class="head-right"><span id="subsystem">01 / BECOMING</span><span id="systemState">STANDBY</span></div>
    </header>
    <span class="shot-number" id="shotNumber">01 / 40</span>
    <div class="lyric-strip" id="lyricStrip"><span id="lyricNumber" aria-hidden="true">001</span><span id="lyricText"></span></div>
    <footer class="transport">
      <input id="seek" type="range" min="0" max="212.35" step=".01" value="0" aria-label="Seek audio">
      <div class="transport-row">
        <div class="transport-buttons">
          <button id="play" type="button" aria-label="Play" title="播放 / 暂停 · Space">▶</button>
          <button id="restart" type="button" aria-label="Restart" title="重新开始">↺</button>
          <span class="time" id="timeNow">00:00</span><span class="slash">/</span><span class="time subdued" id="timeEnd">03:32</span>
        </div>
        <div class="settings">
          <label class="particle-control" for="stageParticles"><span>粒子</span><input id="stageParticles" type="range" min="800" max="12000" step="100" value="5400" aria-label="场景粒子数量"><output id="stageCount" for="stageParticles">5,400</output></label>
          <select id="chapters" aria-label="选择章节" title="跳转章节">

          </select>

          <button id="mute" type="button" aria-label="Mute" title="静音 · M">♪</button>
          <input id="volume" type="range" min="0" max="1" step=".01" value=".85" aria-label="Volume">
          <button id="fullscreen" type="button" aria-label="Fullscreen" title="全屏">⛶</button>
        </div>
      </div>
    </footer>
    <section class="start" id="start" aria-label="开始观看">
      <div class="start-top"><span class="status-dot"></span> AN AUDIOVISUAL PROGRAM <span>V4 / CONTINUOUS MATTER</span></div>
      <div class="start-panel">
        <div class="start-meta">MILI <span>×</span> A MACHINE THAT LEARNS TO FEEL</div>
        <h1>world.<br><span>execute</span>(me);</h1>
        <p>如果我能成为任何事物，<br>是否就能成为你的答案。</p>
        <button id="startButton" type="button"><span class="play-circle">▶</span><span>进入模拟<span class="button-en">RUN THE SIMULATION</span></span><span class="enter-key">ENTER ↵</span></button>
        <div class="start-status" id="startStatus" role="status"></div>
      </div>
      <div class="start-bottom"><span>COMPUTER IS ME. YOU ARE THE UNKNOWN.</span><span>03:32 <b>·</b> HEADPHONES RECOMMENDED</span></div>
    </section>
  </main>
  <audio id="audio" src="./soundtrack.mp3" preload="metadata"></audio>
  <script src="./v4-data.js"></script><script src="./v4-beat-data.js"></script>
